    <script>
        const GROQ_MODEL = "llama-3.3-70b-versatile";

        const questionDatabase = {
            orthographe: [
                { textParts: ["Dans le cadre de ce ", ", il faut analyser les causes."], options: ["développement", "developpement", "dévelopement", "développemment"], correct: 0, explanation: "Correction : 'développement' s'écrit avec un accent aigu, deux 'p' et UN SEUL 'm'." },
                { textParts: ["Les arguments que tu as ", " sont très pertinents."], options: ["avancés", "avancé", "avancées", "avancer"], correct: 0, explanation: "Le participe passé s'accorde avec le COD ('Les arguments', masc. pluriel) car il est placé avant le verbe avec l'auxiliaire 'avoir'." },
                { textParts: ["Il faut faire ", " d'attention aux consignes."], options: ["davantage", "d'avantage", "d'avantages", "d'aventages"], correct: 0, explanation: "'Davantage' (en un seul mot) est l'adverbe de quantité synonyme de 'plus'. 'D'avantage' désigne un gain ou bénéfice." },
                { textParts: ["C'est un véritable ", " pour le personnage principal."], options: ["dilemme", "dilemne", "dilleme", "dilemmee"], correct: 0, explanation: "'Dilemme' s'écrit avec deux 'm' et pas de 'n' (erreur classique due à l'analogie avec indemne)." },
                { textParts: ["Le condamné vit un véritable ", "."], options: ["cauchemar", "cauchemard", "cauchemarre", "cauchemardes"], correct: 0, explanation: "'Cauchemar' ne prend pas de 'd' final, contrairement à l'adjectif dérivé 'cauchemardesque'." },
                { textParts: ["Elle s'est ", " compte de son erreur trop tard."], options: ["rendu", "rendue", "rendus", "rendues"], correct: 0, explanation: "Le COD est 'compte' (se rendre compte de qqc). Placé après le verbe, le participe passé 'rendu' reste invariable." },
                { textParts: ["Il a dû ", " vers le palais pour prévenir Hémon."], options: ["courir", "courrir", "courire", "courirre"], correct: 0, explanation: "Le verbe 'courir' ne prend qu'un seul 'r' à l'infinitif (contrairement à mourir ou nourrir)." },
                { textParts: ["L'un des thèmes majeurs de l'œuvre est l'", " de l'enfance."], options: ["intérêt", "interêt", "intéret", "interet"], correct: 0, explanation: "Le nom 'intérêt' prend un accent aigu sur le premier 'e' et un accent circonflexe sur le second." },
                { textParts: ["Les ", " de Créon sont inflexibles face à la révolte d'Antigone."], options: ["exigences", "exigeances", "éxigences", "éxigeances"], correct: 0, explanation: "Le nom 'exigence' s'écrit sans 'a' devant la terminaison '-gence' et sans accent sur le 'e' initial." },
                { textParts: ["L'", " réservé au condamné à la Conciergerie est glacial."], options: ["accueil", "acceuil", "aceuil", "acueil"], correct: 0, explanation: "Pour obtenir le son 'keu' après le 'c', on écrit 'ue' et non 'eu' : 'accueil'." },
                { textParts: ["Il a ", " une certaine sagesse à travers la souffrance."], options: ["acquis", "acquit", "acqui", "acquise"], correct: 0, explanation: "Le participe passé de 'acquérir' est 'acquis' (avec un 's' muet final)." },
                { textParts: ["Ces deux personnages ", " par leur vision du devoir."], options: ["diffèrent", "différent", "differents", "diffère"], correct: 0, explanation: "Il s'agit ici du verbe 'différer' conjugué à la 3e personne du pluriel (ils diffèrent), à ne pas confondre avec l'adjectif 'différent'." },
                { textParts: ["C'est un problème ", " de celui d'hier."], options: ["différent", "diffèrent", "différents", "differer"], correct: 0, explanation: "Il s'agit ici de l'adjectif qualificatif masculin singulier 'différent'." },
                { textParts: ["", ", si cruelle soit-elle, la sentence doit être exécutée."], options: ["Quelque", "Quel que", "Quelle que", "Quelles que"], correct: 0, explanation: "Devant un adjectif suivi du subjonctif, 'quelque' est un adverbe invariable signifiant 'si' ou 'aussi'." },
                { textParts: ["Le condamné ", " bientôt sa fille pour la dernière fois."], options: ["verra", "voira", "voirra", "vera"], correct: 0, explanation: "Le verbe 'voir' fait 'verra' au futur simple (avec deux 'r')." },
                { textParts: ["Le roi ", " des gardes pour arrêter la coupable."], options: ["enverra", "envoiera", "envera", "envoyera"], correct: 0, explanation: "Le verbe 'envoyer' fait 'enverra' au futur simple (radical irrégulier avec deux 'r')." },
                { textParts: ["Antigone sait qu'elle ", " pour son frère."], options: ["mourra", "mourira", "moura", "mourrait"], correct: 0, explanation: "Le verbe 'mourir' prend deux 'r' au futur simple : 'il mourra'. Le conditionnel serait 'mourrait'." },
                { textParts: ["", " soit son destin, Sidi Mohammed garde sa boîte."], options: ["Quel que", "Quelque", "Quels que", "Quelle que"], correct: 0, explanation: "Devant le verbe être au subjonctif, on écrit 'quel que' en deux mots, accordé avec le sujet masculin singulier 'destin'." },
                { textParts: ["Je ferai mon devoir, ", " y laisser ma vie."], options: ["dussé-je", "dusse-je", "dusses-je", "dussai-je"], correct: 0, explanation: "À la 1re personne du singulier de l'imparfait du subjonctif avec inversion du sujet, le 'e' muet prend un accent aigu (qui se prononce è) pour faciliter la liaison." },
                { textParts: ["Le condamné est ", " à monter sur l'échafaud."], options: ["prêt", "près", "prè", "pré"], correct: 0, explanation: "'Prêt' (avec un t) signifie préparé ou disposé à. À ne pas confondre avec la préposition 'près' (de)." },
                { textParts: ["La foule s'amasse tout ", " de la guillotine."], options: ["près", "prêt", "prè", "pré"], correct: 0, explanation: "'Près' (avec un s) indique la proximité spatiale ou temporelle." },
                { textParts: ["La nourrice ", " Antigone dès l'aube."], options: ["appelle", "appele", "appèle", "apelle"], correct: 0, explanation: "Le verbe 'appeler' double son 'l' devant un 'e' muet pour faire le son 'èl'." },
                { textParts: ["Le prisonnier ", " un regard désespéré sur la cellule."], options: ["jette", "jete", "jète", "gette"], correct: 0, explanation: "Le verbe 'jeter' double son 't' devant un 'e' muet pour faire le son 'èt'." },
                { textParts: ["Le petit garçon aime ", " son imagination de récits fabuleux."], options: ["nourrir", "nourir", "nourire", "nourirres"], correct: 0, explanation: "Le verbe 'nourrir' s'écrit avec deux 'r' après le 'ou'." },
                { textParts: ["Il est ", " obéir aux ordres du souverain."], options: ["censé", "sensé", "sansé", "s'en c'est"], correct: 0, explanation: "'Censé' (avec un c) signifie supposé ou considéré comme devant faire quelque chose." },
                { textParts: ["Ce discours est ", " et plein de bon sens."], options: ["sensé", "censé", "sansé", "s'en c'est"], correct: 0, explanation: "'Sensé' (avec un s) signifie qui a du bon sens, intelligent ou raisonnable." },
                { textParts: ["La boîte de Sidi Mohammed est ", " usée par le temps."], options: ["tout", "toute", "toutes", "tous"], correct: 0, explanation: "L'adverbe 'tout' (signifiant tout à fait) reste invariable devant un adjectif féminin commençant par une voyelle ou un h muet." },
                { textParts: ["Ismène est ", " honteuse d'avoir eu peur."], options: ["toute", "tout", "toutes", "tous"], correct: 0, explanation: "L'adverbe 'tout' s'accorde en genre et en nombre devant un adjectif féminin commençant par une consonne ou un h aspiré (honteuse)." },
                { textParts: ["Elle s'est ", " dans ses pensées les plus sombres."], options: ["perdue", "perdu", "perdus", "perdues"], correct: 0, explanation: "Le participe passé d'un verbe pronominal s'accorde avec le COD s'il est placé avant. Ici, 'se' (elle-même) est COD, donc accord au féminin singulier." },
                { textParts: ["Ils se sont ", " des lettres d'adieu avant la sentence."], options: ["écrit", "écrits", "écrite", "écrites"], correct: 0, explanation: "Le COD est 'des lettres d'adieu', placé après le verbe. Le pronom 'se' est un COI (écrire à soi-même). Le participe reste donc invariable." },
                { textParts: ["Elles se sont ", " à plusieurs reprises."], options: ["parlé", "parlés", "parlée", "parlées"], correct: 0, explanation: "Le verbe 'parler' est indirect (parler à quelqu'un). Le pronom 'se' est COI, le participe passé reste donc invariable." },
                { textParts: ["", " personnage de la pièce a un destin tragique."], options: ["Chaque", "Chacun", "Chacune", "Tous"], correct: 0, explanation: "'Chaque' est un déterminant indéfini singulier qui accompagne un nom. 'Chacun' est un pronom." },
                { textParts: ["J'ai ", " la foule qui se pressait dans la rue."], options: ["aperçu", "apperçu", "aperçut", "apperçut"], correct: 0, explanation: "Le verbe 'apercevoir' prend un seul 'p' et s'écrit avec une cédille devant le 'u' : 'aperçu'." },
                { textParts: ["Le ", " humain de cette exécution est insupportable."], options: ["coût", "cout", "coute", "coûts"], correct: 0, explanation: "Le nom 'coût' prend un accent circonflexe sur le 'u' en orthographe traditionnelle (l'orthographe rectifiée de 1990 accepte cout, mais coût reste la norme classique)." },
                { textParts: ["C'est un ", " marquant de la vie du condamné."], options: ["événement", "évenement", "evenement", "évènement"], correct: 0, explanation: "L'orthographe traditionnelle s'écrit 'événement' (avec deux accents aigus), bien que l'orthographe moderne autorise 'évènement'." }
            ],
            connecteurs: [
                { textParts: ["Certains pensent que la peine de mort est dissuasive. ", ", les statistiques prouvent le contraire."], options: ["Néanmoins", "En effet", "Par conséquent", "D'ailleurs"], correct: 0, explanation: "'Néanmoins' introduit l'opposition indispensable pour réfuter la thèse adverse avec force." },
                { textParts: ["", " ce que l'on pourrait croire, la solitude n'est pas toujours voulue."], options: ["Contrairement à", "Malgré", "Bien que", "Quoique"], correct: 0, explanation: "'Contrairement à' s'associe à un groupe nominal pour marquer le contraste d'idées." },
                { textParts: ["Antigone veut enterrer son frère, ", " cela doive lui coûter la vie."], options: ["bien que", "même si", "en dépit de", "alors que"], correct: 0, explanation: "'Bien que' réclame obligatoirement l'usage du subjonctif ('doive'). 'Même si' aurait requis l'indicatif ('doit')." },
                { textParts: ["Il est important de préserver les traditions, ", " elles fondent notre identité."], options: ["car", "donc", "toutefois", "par conséquent"], correct: 0, explanation: "'Car' est la conjonction de coordination par excellence pour exprimer la cause avec sobriété." },
                { textParts: ["", ", je trouve cette décision injuste."], options: ["Pour ma part", "Au niveau de", "En ce qui concerne", "Quant à"], correct: 0, explanation: "'Pour ma part' exprime l'opinion proprement. Évite 'Au niveau de' qui est un anglicisme ou impropre ici." },
                { textParts: ["Lalla Aicha rend visite à la famille ; ", " elle veut proposer une sortie au sanctuaire."], options: ["en effet", "en revanche", "bien que", "par conséquent"], correct: 0, explanation: "'En effet' introduit une explication confirmant ce qui précède." },
                { textParts: ["Créon refuse d'écouter les supplications ; ", " la sentence sera exécutée."], options: ["par conséquent", "néanmoins", "car", "bien que"], correct: 0, explanation: "'Par conséquent' introduit une relation logique de conséquence directe." },
                { textParts: ["Le condamné espère encore une grâce ; ", " l'heure tourne inexorablement."], options: ["pourtant", "donc", "ainsi", "parce que"], correct: 0, explanation: "'Pourtant' exprime une opposition forte entre l'espoir du condamné et la réalité du temps qui passe." },
                { textParts: ["La solitude l'accable et, ", ", elle le plonge dans la mélancolie."], options: ["de surcroît", "en revanche", "de peur que", "bien que"], correct: 0, explanation: "'De surcroît' marque une idée d'addition, renforçant l'accablement de la solitude." },
                { textParts: ["", " le condamné supplie, la justice reste sourde."], options: ["Bien que", "Même si", "Malgré", "En dépit de"], correct: 0, explanation: "'Bien que' est une conjonction de concession suivie obligatoirement du subjonctif ('supplie')." },
                { textParts: ["", " Sidi Mohammed est jeune, il comprend la détresse de ses parents."], options: ["Même si", "Bien que", "Quoique", "Malgré"], correct: 0, explanation: "'Même si' introduit une concession à l'indicatif ('est')." },
                { textParts: ["", " les avertissements de la nourrice, Antigone sort dans la nuit."], options: ["Malgré", "Bien que", "Quoique", "Même si"], correct: 0, explanation: "'Malgré' est une préposition qui s'emploie toujours suivie d'un groupe nominal." },
                { textParts: ["Les gardes rient ", " le devoir de mémoire est ridicule."], options: ["sous prétexte que", "parce que", "puisque", "vu que"], correct: 0, explanation: "'Sous prétexte que' introduit une cause prétendue ou contestée par le locuteur." },
                { textParts: ["", " tu refuses de m'écouter, je dois agir seule."], options: ["Puisque", "Car", "Comme", "Sous prétexte que"], correct: 0, explanation: "'Puisque' exprime une cause évidente, connue de l'interlocuteur ou déjà posée." },
                { textParts: ["Le narrateur espère revoir sa fille, ", " elle ne l'oublie pas."], options: ["pourvu qu'", "bien qu'", "afin qu'", "de peur qu'"], correct: 0, explanation: "'Pourvu que' exprime une condition nécessaire assortie d'un souhait (suivi du subjonctif)." },
                { textParts: ["Il faut agir vite ", " la loi soit respectée."], options: ["pour que", "parce que", "bien que", "alors que"], correct: 0, explanation: "'Pour que' introduit une proposition subordonnée de but réclamant le subjonctif." },
                { textParts: ["Elle se tait ", " réveiller les soupçons des gardes."], options: ["de crainte de", "afin de", "pour", "de sorte à"], correct: 0, explanation: "'De crainte de' introduit un but négatif avec un verbe à l'infinitif." },
                { textParts: ["", " Créon perd sa nièce, mais il perd aussi son fils."], options: ["Non seulement", "D'une part", "Soit", "Comme"], correct: 0, explanation: "'Non seulement' s'associe à 'mais aussi' (ou 'mais encore') pour lier deux faits de façon cumulative." },
                { textParts: ["La foule est ", " dense que le cortège peine à avancer."], options: ["si", "tant", "tellement", "plus"], correct: 0, explanation: "'Si' modifie l'adjectif 'dense' pour exprimer l'intensité corrélée à la conséquence ('que...')." },
                { textParts: ["", " son entourage ne le comprend pas, Sidi Mohammed se réfugie dans son imaginaire."], options: ["Comme", "Parce que", "Puisque", "Car"], correct: 0, explanation: "'Comme' s'emploie en début de phrase pour marquer la cause avec force." },
                { textParts: ["", " s'achève la journée difficile du petit garçon."], options: ["Ainsi", "Néanmoins", "Car", "Bien que"], correct: 0, explanation: "'Ainsi' s'emploie en début de phrase pour introduire une conclusion ou une manière d'aboutir." },
                { textParts: ["Il faut étudier les faits : ", " le crime est grave, d'autre part le châtiment est barbare."], options: ["d'une part", "non seulement", "soit", "d'abord"], correct: 0, explanation: "'D'une part' appelle la corrélation 'd'autre part' pour structurer une énumération bipartite." },
                { textParts: ["Antigone choisit le devoir moral ; Ismène, ", ", préfère la sécurité."], options: ["en revanche", "en effet", "ainsi", "car"], correct: 0, explanation: "'En revanche' marque l'opposition ou le contraste entre le choix d'Antigone et celui d'Ismène." },
                { textParts: ["On peut éviter la tragédie ", " renoncer à l'orgueil."], options: ["à condition de", "de peur de", "afin de", "bien que"], correct: 0, explanation: "'À condition de' exprime une restriction/condition suivie d'un infinitif." },
                { textParts: ["Lalla Zoubida protège son fils ", " il ne tombe malade."], options: ["de peur qu'", "afin qu'", "bien qu'", "si bien qu'"], correct: 0, explanation: "'De peur que' introduit une crainte (but à éviter) et réclame le subjonctif avec le 'ne' explétif." },
                { textParts: ["Le condamné est isolé dans son cachot, ", " ses pensées l'obsèdent."], options: ["si bien que", "pour que", "bien que", "à condition que"], correct: 0, explanation: "'Si bien que' est une locution conjonctive introduisant une conséquence logique à l'indicatif." },
                { textParts: ["", " l'heure de l'exécution approche, l'angoisse grandit."], options: ["Au fur et à mesure que", "Bien que", "Puisque", "De peur que"], correct: 0, explanation: "'Au fur et à mesure que' exprime une idée de progression temporelle simultanée." },
                { textParts: ["", " de moyens financiers, le père doit quitter sa famille."], options: ["Faute", "Grâce", "À cause", "Par"], correct: 0, explanation: "'Faute de' indique une cause négative due à un manque ou une absence." },
                { textParts: ["Sidi Mohammed surmonte sa solitude ", " ses objets magiques."], options: ["grâce à", "à cause de", "en dépit de", "faute de"], correct: 0, explanation: "'Grâce à' introduit une cause positive ou bénéfique." },
                { textParts: ["La famille sombre dans la tristesse ", " la perte de la bourse."], options: ["à cause de", "grâce à", "en vue de", "afin de"], correct: 0, explanation: "'À cause de' introduit une cause négative ou préjudiciable." },
                { textParts: ["", ", l'œuvre de Hugo reste un plaidoyer intemporel contre la peine de mort."], options: ["En conclusion", "D'abord", "De plus", "Néanmoins"], correct: 0, explanation: "'En conclusion' est un connecteur de clôture parfait pour résumer une réflexion." },
                { textParts: ["Le roi sait qu'Antigone a raison ; ", " il tente d'étouffer l'affaire."], options: ["pourtant", "car", "bien que", "donc"], correct: 0, explanation: "'Pourtant' marque la contradiction entre la conviction intime de Créon et ses actes politiques." },
                { textParts: ["Le destin d'Antigone est scellé, ", " Créon décide de l'épargner."], options: ["sauf si", "bien que", "pourvu que", "si bien que"], correct: 0, explanation: "'Sauf si' introduit une hypothèse restrictive ou une exception permettant d'éviter l'issue tragique." },
                { textParts: ["Il écrit son journal ", " occuper son esprit et témoigner."], options: ["pour", "parce que", "bien que", "de crainte de"], correct: 0, explanation: "'Pour' suivi de l'infinitif exprime l'intention ou le but recherché par l'action d'écrire." },
                { textParts: ["Le condamné souffre dans sa cellule ", " la foule rit au-dehors."], options: ["tandis que", "parce que", "afin que", "bien que"], correct: 0, explanation: "'Tandis que' marque l'opposition ou le contraste simultané entre deux situations." }
            ],
            argumentation: [
                { textParts: ["Pour répondre à la question 9, je dois d'abord ", " mon point de vue, puis le justifier."], options: ["énoncer", "étayer", "réfuter", "valider"], correct: 0, explanation: "On 'énonce' (exprime clairement) sa thèse d'abord, avant de l'étayer (la soutenir par des arguments)." },
                { textParts: ["L'auteur fait un ", " vibrant contre la peine de mort."], options: ["réquisitoire", "plaidoyer", "éloge", "panégyrique"], correct: 0, explanation: "Un 'réquisitoire' est un discours d'accusation contre un concept. Un 'plaidoyer' le défendrait." },
                { textParts: ["Il est ", " que la superstition joue un rôle majeur dans la société marocaine de l'époque."], options: ["indéniable", "invraisemblable", "ambigu", "contestable"], correct: 0, explanation: "'Indéniable' est synonyme d'incontestable. Idéal pour appuyer une certitude objective." },
                { textParts: ["Je ", " totalement à l'idée selon laquelle la solitude renforce la personnalité."], options: ["souscris", "partage", "approuve", "adhère"], correct: 0, explanation: "On dit 'souscrire à' (avec préposition). Si on utilisait 'partage', il n'y aurait pas de préposition à sa suite." },
                { textParts: ["L'élève doit ", " sa thèse à l'aide d'exemples précis tirés des œuvres."], options: ["étayer", "réfuter", "éluder", "négliger"], correct: 0, explanation: "'Étayer' signifie soutenir, consolider ou appuyer une thèse à l'aide de preuves ou d'exemples." },

        // --- THE GROQ API BRIDGE ---
        async function fetchFromGroq(sysPrompt, userPrompt, jsonMode = false) {
            const key = localStorage.getItem('defiZeroFauteGroqKey');
            if (!key) throw new Error("Clé API Groq manquante.");

            const payload = {
                model: GROQ_MODEL,
                messages: [
                    { role: "system", content: sysPrompt },
                    { role: "user", content: userPrompt }
                ],
                temperature: 0.3,
                max_completion_tokens: 1024
            };
            if (jsonMode) payload.response_format = { type: "json_object" };

            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || "Erreur de l'API Groq");
            }
            const data = await response.json();
            return data.choices[0].message.content;
        }

                        </div>
                        <p class="text-[11px] text-slate-200 bg-slate-950 p-3 rounded-lg border border-slate-800 font-serif italic mb-3">${subject}</p>
                        <textarea id="stress-textarea" class="w-full flex-grow bg-slate-950 border border-slate-700 rounded-lg p-3 text-[11px] text-white focus:outline-none focus:border-rose-500 resize-none min-h-[200px]" placeholder="I. Introduction (Amorce, Thèse...)\nII. Développement...\nIII. Conclusion..."></textarea>
                        <button onclick="evaluateStressPlan()" class="mt-3 bg-white text-rose-900 px-4 py-2 rounded-lg text-[11px] font-bold hover:bg-slate-200">Soumettre le plan en avance</button>
                    </div>
                `;
            } else if (step === 'evaluating') {
                content = `<div class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center flex-grow flex flex-col justify-center"><i class="ph-cpu text-4xl text-rose-500 animate-pulse mb-3 mx-auto"></i><h3 class="text-sm font-bold">L'examinateur IA délibère...</h3></div>`;
            } else if (step === 'feedback') {
                content = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex-grow flex flex-col">
                        <h3 class="text-xs font-bold text-rose-400 mb-3 border-b border-slate-800 pb-2"><i class="ph-clipboard-text"></i> Rapport de l'examinateur :</h3>
                        <div class="text-[11px] text-slate-300 leading-relaxed space-y-2 overflow-y-auto custom-scrollbar flex-grow pr-2">${feedbackHtml}</div>
                    </div>
                `;
            }

            return `<div class="p-3 max-w-2xl mx-auto w-full fade-in flex flex-col min-h-[92vh]"><button onclick="setView('home')" class="text-slate-400 hover:text-white mb-2 text-[11px] font-semibold w-max"><i class="ph-arrow-left"></i> Fuir l'épreuve</button>${content}</div>`;
        }

        function renderMarathon() {
            const { questions, currentIndex, currentStreak, maxStreak, selectedAnswer, isAnswerChecked, currentOptionsShuffled } = state.marathonState;
            const goal = 35;

            if (currentStreak >= goal) {
                return `
                    <div class="p-4 max-w-xl mx-auto w-full fade-in text-center flex flex-col justify-center min-h-[92vh]">
                        <div class="p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl mb-6 max-w-sm mx-auto">
                            <i class="ph-crown text-5xl text-amber-400 animate-bounce mb-3 block"></i>
                            <h2 class="text-xl font-extrabold text-white">Marathon Réussi !</h2>
                            <p class="text-xs text-slate-400 mt-2">Félicitations ! Tu as enchaîné ${goal} réponses correctes d'affilée sans commettre la moindre erreur. Tu es fin prêt pour l'examen de français !</p>
                        </div>
                        <div class="flex gap-3 justify-center">
                            <button onclick="startMarathon()" class="bg-violet-600 hover:bg-violet-500 text-white py-2.5 px-6 rounded-xl text-xs font-bold transition-all"><i class="ph-arrow-counter-clockwise"></i> Recommencer</button>
                            <button onclick="setView('home')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 px-6 rounded-xl text-xs font-bold border border-slate-700 transition-all"><i class="ph-house"></i> Accueil</button>
                        </div>
                    </div>
                `;
            }

            const q = questions[currentIndex];
            const progress = (currentStreak / goal) * 100;

            let optionsHtml = currentOptionsShuffled.map((opt, idx) => {
                let btnClass = "bg-slate-900 border-slate-700 text-slate-200 hover:bg-slate-800";
                let icon = '';
                if (isAnswerChecked) {
                    if (opt.originalIdx === q.correct) {
                        btnClass = "bg-emerald-950/60 border-emerald-500 text-emerald-300";
                        icon = '<i class="ph-check-circle text-lg text-emerald-400"></i>';
                    } else if (idx === selectedAnswer) {
                        btnClass = "bg-rose-950/60 border-rose-500 text-rose-300";
                        icon = '<i class="ph-x-circle text-lg text-rose-400"></i>';
                    } else {
                        btnClass = "bg-slate-900 border-slate-800 text-slate-500 opacity-40";
                    }
                } else if (selectedAnswer === idx) {
                    btnClass = "bg-violet-900/40 border-violet-500 text-violet-300";
                }
                return `<button onclick="handleMarathonSelect(${idx})" ${isAnswerChecked ? 'disabled' : ''} class="flex items-center justify-between p-3 rounded-xl border transition-all text-xs font-medium text-left ${btnClass}"><span class="flex items-center gap-2"><span class="text-slate-500 font-mono text-[9px] bg-slate-950 px-1 py-0.5 rounded">${idx + 1}</span> ${opt.text}</span>${icon}</button>`;
            }).join('');

            return `
                <div class="p-3 max-w-xl mx-auto w-full fade-in min-h-[92vh] flex flex-col justify-center">
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="setView('home')" class="text-slate-400 hover:text-white text-[11px] font-semibold"><i class="ph-arrow-left"></i> Quitter le Marathon</button>
                        <div class="flex items-center gap-2 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
                            <span class="flex items-center gap-1 text-[10px] font-bold text-amber-400"><i class="ph-fire text-xs"></i> Streak : ${currentStreak} / ${goal}</span>
                            <span class="text-slate-600">|</span>
                            <span class="text-[9px] text-slate-400 font-medium">Record : ${maxStreak}</span>
                        </div>
                    </div>

                    <div class="w-full bg-slate-900 h-1.5 rounded-full mb-5 border border-slate-800"><div class="bg-violet-500 h-full transition-all" style="width: ${progress}%"></div></div>

                    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 mb-5 relative overflow-hidden shadow-2xl">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-violet-500/5 rounded-full blur-3xl pointer-events-none"></div>

                        <p class="text-sm font-medium mb-5 text-slate-100 leading-relaxed">${q.textParts[0]} <span class="inline-block border-b-2 mx-1 font-bold px-2 py-0.5 rounded ${selectedAnswer === null ? 'border-slate-500 text-violet-400 bg-slate-950' : (isAnswerChecked && currentOptionsShuffled[selectedAnswer]?.originalIdx === q.correct ? 'border-emerald-500 text-emerald-400 bg-emerald-950' : (isAnswerChecked ? 'border-rose-500 text-rose-400 bg-rose-950' : 'border-violet-500 text-violet-300 bg-violet-950'))}">${selectedAnswer !== null ? currentOptionsShuffled[selectedAnswer].text : '......'}</span> ${q.textParts[1]}</p>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">${optionsHtml}</div>

                        ${isAnswerChecked ? `
                            <div class="mt-4 p-3 rounded-xl border ${currentOptionsShuffled[selectedAnswer].originalIdx === q.correct ? 'bg-emerald-900/10 border-emerald-900/50 text-emerald-200' : 'bg-rose-900/10 border-rose-900/50 text-rose-200'} fade-in text-[11px] leading-relaxed">
                                <div class="font-bold flex items-center gap-1.5 mb-1">
                                    <i class="${currentOptionsShuffled[selectedAnswer].originalIdx === q.correct ? 'ph-sparkle text-emerald-400' : 'ph-x text-rose-400'}"></i>
                                    ${currentOptionsShuffled[selectedAnswer].originalIdx === q.correct ? 'Correct ! Ton streak augmente.' : 'Erreur ! Le marathon prend fin.'}
                                </div>
                                <div>${q.explanation}</div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="flex justify-end">
                        ${!isAnswerChecked
                            ? `<button onclick="checkMarathonAnswer()" ${selectedAnswer === null ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl font-bold text-xs bg-violet-600 hover:bg-violet-500 text-white disabled:opacity-50 transition-all shadow-lg shadow-violet-950/40">Valider la réponse</button>`
                            : `<button onclick="nextMarathonQuestion()" class="px-5 py-2.5 rounded-xl font-bold text-xs ${currentOptionsShuffled[selectedAnswer].originalIdx === q.correct ? 'bg-white text-slate-900 hover:bg-slate-200' : 'bg-rose-600 hover:bg-rose-500 text-white'} transition-all shadow-md">${currentOptionsShuffled[selectedAnswer].originalIdx === q.correct ? 'Question suivante <i class="ph-caret-right"></i>' : 'Recommencer le Défi'}</button>`
                        }
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            switch (state.view) {
                case 'home': app.innerHTML = renderHome(); break;
                case 'playing': app.innerHTML = renderPlaying(); break;
                case 'result': app.innerHTML = renderResult(); break;
                case 'prodEcrite': app.innerHTML = renderProdEcrite(); break;
                case 'stressSimulator': app.innerHTML = renderStressSimulator(); break;
                case 'moduleSelect': app.innerHTML = renderModuleSelect(); break;
                case 'generatingQuiz': app.innerHTML = renderGeneratingQuiz(); break;
                case 'marathon': app.innerHTML = renderMarathon(); break;
            }
            if (state.view === 'prodEcrite' && state.prodState.step === 'correcting' && !state.prodState.feedback) {
                const input = document.getElementById('correction-input');
                if (input) input.focus();
            }
        }

        window.onload = function () { render(); };

        window.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (state.view === 'playing') {
                if (['1', '2', '3', '4'].includes(e.key) && !state.isAnswerChecked) {
                    const idx = parseInt(e.key) - 1;
                    if (idx < state.currentOptionsShuffled.length) handleSelect(idx);
                }
                if (e.key === 'Enter') {
                    if (!state.isAnswerChecked && state.selectedAnswer !== null) checkAnswer();
                    else if (state.isAnswerChecked) nextQuestion();
                }
            } else if (state.view === 'marathon') {
                const mState = state.marathonState;
                if (['1', '2', '3', '4'].includes(e.key) && !mState.isAnswerChecked) {
                    const idx = parseInt(e.key) - 1;
                    if (idx < mState.currentOptionsShuffled.length) handleMarathonSelect(idx);
                }
                if (e.key === 'Enter') {
                    if (!mState.isAnswerChecked && mState.selectedAnswer !== null) checkMarathonAnswer();
                    else if (mState.isAnswerChecked) nextMarathonQuestion();
                }
            }
        });
    </script>
</body>

</html>
